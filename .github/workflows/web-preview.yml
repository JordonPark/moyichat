name: MoyiChat web preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.50.1
        run: |
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build web preview
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --no-pub --no-web-resources-cdn

      - name: Save web build
        uses: actions/upload-artifact@v4
        with:
          name: MoyiChat-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 7
