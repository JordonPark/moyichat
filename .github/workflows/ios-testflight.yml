name: MoyiChat TestFlight

on:
  workflow_dispatch:
    inputs:
      ota_run_id:
        description: Optional iOS OTA archive run ID for an internal beta
        required: false
        type: string
      advertising:
        description: Banner mode for a new archive
        type: choice
        options: ['off', 'test', 'live']
        default: 'off'

permissions:
  actions: read
  contents: read

concurrency:
  group: moyichat-testflight

jobs:
  upload:
    if: github.ref == 'refs/heads/master'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        if: inputs.ota_run_id == ''
        with:
          persist-credentials: false

      - name: Set up Flutter 3.50.1
        if: inputs.ota_run_id == ''
        run: |
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build the App Store review archive
        if: inputs.ota_run_id == ''
        env:
          ADS_MODE: ${{ inputs.advertising }}
          IOS_BANNER_ID: ${{ vars.MOYI_ADMOB_IOS_BANNER_ID }}
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          flutter pub get --enforce-lockfile
          version=1.0
          defines=("--dart-define=MOYI_APP_VERSION=$version")
          case "$ADS_MODE" in
            off) ;;
            test) defines+=(--dart-define=MOYI_ADMOB_IOS_TEST_ADS=true) ;;
            live)
              if [[ ! "$IOS_BANNER_ID" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]; then
                echo '::error::Set the production iOS banner unit in MOYI_ADMOB_IOS_BANNER_ID.'
                exit 1
              fi
              defines+=("--dart-define=MOYI_ADMOB_IOS_BANNER_ID=$IOS_BANNER_ID")
              ;;
            *) exit 1 ;;
          esac
          flutter build ipa --release --no-codesign --no-pub \
            --build-name="$version" --build-number="$GITHUB_RUN_NUMBER" \
            "${defines[@]}"
          test -f build/ios/archive/Runner.xcarchive/Info.plist
          test -z "$(find build/ios/archive/Runner.xcarchive -name shorebird.yaml -print -quit)"

      - name: Retrieve the internal OTA archive
        if: inputs.ota_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OTA_RUN_ID: ${{ inputs.ota_run_id }}
          ADS_MODE: ${{ inputs.advertising }}
        run: |
          if [[ "$ADS_MODE" != off ]]; then
            echo '::error::Select a new archive to change its banner mode.'
            exit 1
          fi
          if [[ ! "$OTA_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Enter the numeric ID of a successful iOS OTA run.'
            exit 1
          fi

          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/shorebird-ota.yml" --jq .id)
          is_release=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OTA_RUN_ID" \
            --jq ".conclusion == \"success\" and .head_branch == \"master\" and .workflow_id == $workflow_id")
          test "$is_release" = true
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OTA_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "MoyiChat-OTA-unsigned.xcarchive.zip" and .expired == false)')
          artifact_id=$(jq -er '.id' <<< "$artifact")
          expected_digest=$(jq -er '.digest | sub("^sha256:"; "")' <<< "$artifact")

          mkdir -p build/ios/archive
          scratch=$(mktemp -d "$RUNNER_TEMP/moyichat-download.XXXXXX")
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$scratch/archive.zip"
          actual_digest=$(shasum -a 256 "$scratch/archive.zip" | awk '{print $1}')
          test "$actual_digest" = "$expected_digest"
          ditto -x -k "$scratch/archive.zip" build/ios/archive

      - name: Sign archive and upload to App Store Connect
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ADS_MODE: ${{ inputs.advertising }}
        run: |
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ || ! "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ || -z "$ASC_ISSUER_ID" || -z "$ASC_PRIVATE_KEY" ]]; then
            echo '::error::Configure the App Store Connect team key and Apple team ID.'
            exit 1
          fi
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/moyichat-sign.XXXXXX")
          key="$scratch/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          unset ASC_PRIVATE_KEY
          archive="$PWD/build/ios/archive/Runner.xcarchive"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$archive/Info.plist")" = com.moyichat.moyichat
          frameworks="$archive/Products/Applications/Runner.app/Frameworks"
          # Give the linker-generated SDK stubs complete bundle signatures
          # before Xcode re-signs the archive for App Store distribution.
          for name in GoogleMobileAds UserMessagingPlatform; do
            framework="$frameworks/$name.framework"
            if [[ -d "$framework" ]]; then
              codesign --force --sign - "$framework"
              codesign --verify --strict "$framework"
            fi
          done

          options="$scratch/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string upload "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          if [[ "$ADS_MODE" == test ]]; then
            plutil -insert testFlightInternalTestingOnly -bool YES "$options"
          fi

          xcodebuild -exportArchive -archivePath "$archive" \
            -exportPath "$scratch/export" -exportOptionsPlist "$options" \
            -allowProvisioningUpdates -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
