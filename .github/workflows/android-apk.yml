name: MoyiChat Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.50.1
        run: |
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Android build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Build Android release APK
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64,android-x64 --no-pub

      - name: Verify and prepare APK
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify --print-certs "$apk"
          badging=$("$build_tools/aapt2" dump badging "$apk")
          [[ "$badging" == *"package: name='com.moyichat.moyichat'"* ]]
          [[ "$badging" == *"native-code: 'arm64-v8a' 'x86_64'"* ]]
          cp "$apk" "$RUNNER_TEMP/MoyiChat.apk"

      - name: Save APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/MoyiChat.apk
          if-no-files-found: error
          archive: false
          retention-days: 7
