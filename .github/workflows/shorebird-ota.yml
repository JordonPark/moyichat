name: MoyiChat OTA

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [android, ios]
        required: true
      operation:
        description: Create a full release or a patch
        type: choice
        options: [release, patch]
        required: true
      release_version:
        description: Version to patch (for example 0.1.0+2)
        type: string
      track:
        description: Patch track
        type: choice
        options: [staging, stable]
        default: staging

permissions:
  contents: read

concurrency:
  group: shorebird-${{ inputs.platform }}

jobs:
  ota:
    runs-on: ${{ inputs.platform == 'ios' && 'xcode-27' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Code Push
        env:
          SHOREBIRD_APP_ID: ${{ vars.SHOREBIRD_APP_ID }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$SHOREBIRD_APP_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo '::error::Set the SHOREBIRD_APP_ID repository variable to the registered app ID.'
            exit 1
          fi
          if [[ -z "$SHOREBIRD_TOKEN" ]]; then
            echo '::error::Set the SHOREBIRD_TOKEN Actions secret.'
            exit 1
          fi
          if [[ "$OPERATION" == patch && ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo '::error::Enter the exact installed release version and build number.'
            exit 1
          fi
          printf 'app_id: %s\nauto_update: false\n' "$SHOREBIRD_APP_ID" > shorebird.yaml
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("pubspec.yaml")
          content = pubspec.read_text(encoding="utf-8")
          if "    - shorebird.yaml\n" not in content:
              marker = "  assets:\n"
              if content.count(marker) != 1:
                  raise ValueError("Expected one Flutter assets section in pubspec.yaml")
              pubspec.write_text(content.replace(marker, marker + "    - shorebird.yaml\n"), encoding="utf-8")
          PY

      - uses: shorebirdtech/setup-shorebird@v1

      - uses: actions/setup-java@v6
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build dependencies
        if: inputs.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Build and register release
        if: inputs.operation == 'release'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
          # Shorebird's Flutter fork publishes engine releases separately.
          FLUTTER_VERSION: '3.50.0'
        run: |
          if [[ "$PLATFORM" == android ]]; then
            shorebird release android --flutter-version="$FLUTTER_VERSION" \
              --artifact apk --target-platform android-arm64,android-x64
          else
            shorebird release ios --flutter-version="$FLUTTER_VERSION" --no-codesign
            ditto -c -k --keepParent build/ios/archive/Runner.xcarchive \
              "$RUNNER_TEMP/MoyiChat-OTA-unsigned.xcarchive.zip"
          fi

      - name: Save Android test APK
        if: inputs.operation == 'release' && inputs.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: MoyiChat-OTA-test-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Save iOS archive for signing
        if: inputs.operation == 'release' && inputs.platform == 'ios'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/MoyiChat-OTA-unsigned.xcarchive.zip
          archive: false
          if-no-files-found: error

      - name: Publish patch
        if: inputs.operation == 'patch'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          TRACK: ${{ inputs.track }}
        run: |
          signing_args=()
          if [[ "$PLATFORM" == ios ]]; then
            signing_args+=(--no-codesign)
          fi
          shorebird patch "$PLATFORM" --release-version="$RELEASE_VERSION" \
            --track="$TRACK" "${signing_args[@]}"
